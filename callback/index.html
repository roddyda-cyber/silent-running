<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Silent Running Poster: Connected</title>
<style>body{font:16px/1.6 system-ui,Segoe UI,sans-serif;max-width:620px;margin:40px auto;padding:0 16px;color:#1b2330;background:#fff}button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#0b6;color:#fff;cursor:pointer}#s{color:#5a6577}</style></head><body>
<h1>Almost done</h1><p>Click the button, then tell Claude "copied". The code is used once by the poster on your PC and expires in minutes.</p>
<button id="b">Copy code</button> <span id="s"></span>
<script>const c=new URLSearchParams(location.search).get('code')||'';document.getElementById('b').onclick=()=>navigator.clipboard.writeText(c).then(()=>document.getElementById('s').textContent=c?'Copied.':'No code in this link.');</script>
</body></html>
